name: Feature request
description: Suggest an improvement or a new database backend
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the app does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: input
    id: backend
    attributes:
      label: If this is a new backend, which database and does it expose a client-accessible API (no server required)?
