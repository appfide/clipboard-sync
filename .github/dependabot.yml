version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: pub
    directory: /packages/clipsync_core
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, core]
    open-pull-requests-limit: 10

  - package-ecosystem: pub
    directory: /apps/clipboard_sync
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, app]
    open-pull-requests-limit: 10

  - package-ecosystem: gradle
    directory: /apps/clipboard_sync/android
    schedule:
      interval: monthly
    labels: [dependencies, android]
