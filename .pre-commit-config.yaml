# Local commit gates. Install once with:  pre-commit install --install-hooks
# CI re-runs every one of these, so bypassing locally (--no-verify) only
# delays the failure.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        args: ["--config=.gitleaks.toml", "--redact"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        exclude: ^\.gitleaks\.toml$
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^(apps/.*/(ios|macos)/.*\.yaml|.*/pubspec\.lock)$
      - id: check-json
        exclude: ^\.vscode/
      - id: check-toml
      - id: end-of-file-fixer
        exclude: \.(png|jpg|jpeg|gif|ico|icns|svg|ttf|otf|woff2?)$
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: \.(png|jpg|jpeg|gif|ico|icns|svg|ttf|otf|woff2?)$
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--strict", "feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: verify-secrets
        name: verify no credential files / hardcoded endpoints
        entry: scripts/verify_secrets.sh
        language: script
        pass_filenames: true
        always_run: false

      - id: dart-format
        name: dart format
        entry: dart format --set-exit-if-changed
        language: system
        files: \.dart$
        exclude: \.(g|freezed|gr|drift)\.dart$

      - id: dart-analyze-core
        name: dart analyze (packages/clipsync_core)
        entry: scripts/analyze.sh packages/clipsync_core
        language: script
        files: ^packages/clipsync_core/.*\.dart$
        pass_filenames: false

      - id: dart-analyze-app
        name: flutter analyze (apps/clipboard_sync)
        entry: scripts/analyze.sh apps/clipboard_sync
        language: script
        files: ^apps/clipboard_sync/.*\.dart$
        pass_filenames: false
