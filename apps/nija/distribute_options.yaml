# flutter_distributor configuration. CI invokes:
#   flutter_distributor package --platform <p> --targets <t> --artifact-name 'ClipboardSync-{{build_name}}-{{platform}}.{{ext}}' --build-dart-define APP_VERSION=... --build-dart-define GIT_SHA=...
# The release entries below are for local, all-in-one runs:
#   flutter_distributor release --name local-<platform>
output: dist/
releases:
  - name: local-macos
    jobs:
      - name: dmg
        package: { platform: macos, target: dmg }
  - name: local-windows
    jobs:
      - name: exe
        package: { platform: windows, target: exe }
      - name: zip
        package: { platform: windows, target: zip }
  - name: local-linux
    jobs:
      - name: deb
        package: { platform: linux, target: deb }
      - name: appimage
        package: { platform: linux, target: appimage }
  - name: local-android
    jobs:
      - name: apk
        package: { platform: android, target: apk }
      - name: aab
        package: { platform: android, target: aab }
